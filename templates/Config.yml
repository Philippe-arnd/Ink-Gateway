# Config.yml — Book Configuration Template
# Copy this file to: Global Material/Config.yml in each book repository.
# All fields are required. See comments for valid values.
#
# NOTE: The AI model is NOT configured here — it's chosen per-user in the
# Ink-Gateway-App web app (Settings), or per-call if you're driving ink-cli
# yourself via its MCP server.

# Language to write in (e.g. English, French, Spanish, German).
language: English

# Target total length of the finished book in words.
# Standard novel: 80000–100000. Novella: 40000–60000.
target_length: 90000

# Total number of chapters planned for the book.
chapter_count: 30

# Prose structure within each chapter.
# Options: linear, multi-pov, vignette
chapter_structure: linear

# Reference length for a single writing pass (e.g. one AI-assisted session in
# the web app). Not enforced automatically — a guide for pacing.
words_per_session: 1500

# Number of recent Summary.md paragraphs to include in context.
# Keeps input token usage bounded as the book grows.
summary_context_entries: 5

# Target words per chapter. `advance-chapter` requires the current chapter to
# have reached ≥ 90% of this before it will move to the next chapter.
words_per_chapter: 3000

# Context window of the AI model used, in tokens. Reserved for future use by
# context-truncation logic; not currently consulted by any command.
# Default (200000) targets Claude's standard context window.
context_window_tokens: 200000

# Approximate number of words per page for pagination markers in Full_Book.md.
# Standard paperback: 250. Large print: 150. Dense literary: 300.
words_per_page: 250

# Maximum wall-clock minutes a session lock (.ink-running) is considered
# valid before `doctor`/`status` report it as stale.
session_timeout_minutes: 60
